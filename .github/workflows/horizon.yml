name: Build Horizon mod

on:
  push:
    paths:
      - 'horizon/**'
      - '.github/workflows/horizon.yml'
  workflow_dispatch:
    inputs:
      horizon:
        description: "Horizon build the mod is made for: nightly, nightly-YYYY-MM-DD or a commit sha (the game's log starts with its build, e.g. 6d765e0)"
        default: nightly

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-horizon-mod
        run: cargo install --locked --git https://github.com/horizon-rust/horizon cargo-horizon-mod

      - name: Scaffold a wasm project (this pins the current SDK)
        run: |
          mkdir -p "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          cargo horizon-mod new enderling --template wasm
          cd enderling
          cargo horizon-mod update --horizon "${{ inputs.horizon || 'nightly' }}"
          cd ..
          echo "--- scaffold Cargo.toml"; cat enderling/Cargo.toml
          echo "--- scaffold horizon-mod.toml"; cat enderling/horizon-mod.toml

      - name: Lay our sources over the scaffold
        run: |
          B="$RUNNER_TEMP/build"
          cp -a "$RUNNER_TEMP/scaffold/enderling" "$B"
          rm -rf "$B/src"
          cp -r horizon/src horizon/meshes horizon/assets "$B/"
          cp horizon/horizon-mod.toml "$B/horizon-mod.toml"
          echo "B=$B" >> "$GITHUB_ENV"

      - name: Build
        run: cd "$B" && cargo horizon-mod build --wasm

      - name: Package contents
        run: |
          cd "$B"
          ls -la target/horizon-mod/
          unzip -l target/horizon-mod/enderling.hmod || tar -tvf target/horizon-mod/enderling.hmod || true

      - name: Publish as the horizon-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete horizon-latest --yes --cleanup-tag || true
          gh release create horizon-latest "$B/target/horizon-mod/enderling.hmod" \
            --title "Horizon mod (latest)" \
            --notes "Enderling for Horizon, built from $GITHUB_SHA. Put enderling.hmod in horizon-mods and add mod.enderling:true to horizon-mods.txt." \
            --target "$GITHUB_SHA"
